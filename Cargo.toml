[package]
name = "kobayashi"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "normalize_stfc_data"
path = "src/bin/normalize_stfc_data.rs"

[[bin]]
name = "normalize_data_stfc_space"
path = "src/bin/normalize_data_stfc_space.rs"

[[bin]]
name = "normalize_hostiles_stfc_space"
path = "src/bin/normalize_hostiles_stfc_space.rs"

[[bin]]
name = "import_forbidden_chaos"
path = "src/bin/import_forbidden_chaos.rs"

[[bin]]
name = "import_syndicate_reputation"
path = "src/bin/import_syndicate_reputation.rs"

[[bin]]
name = "inspect_syndicate_xlsx"
path = "src/bin/inspect_syndicate_xlsx.rs"

[[bin]]
name = "syndicate_bonuses"
path = "src/bin/syndicate_bonuses.rs"

[[bin]]
name = "building_combat_bonuses"
path = "src/bin/building_combat_bonuses.rs"

[[bin]]
name = "validate_data"
path = "src/bin/validate_data.rs"

[[bin]]
name = "generate_lcars"
path = "src/bin/generate_lcars.rs"

[[bin]]
name = "report_unknown_mappings"
path = "src/bin/report_unknown_mappings.rs"

[[bin]]
name = "benchmark_simulator"
path = "src/bin/benchmark_simulator.rs"

[[bin]]
name = "tiered_scout_budget_compare"
path = "src/bin/tiered_scout_budget_compare.rs"

[[bin]]
name = "benchmark_parallel_speedup"
path = "src/bin/benchmark_parallel_speedup.rs"

[[bin]]
name = "generate_officer_scorecard"
path = "src/bin/generate_officer_scorecard.rs"

[[bin]]
name = "stfc_cc_cheat_sheet_report"
path = "src/bin/stfc_cc_cheat_sheet_report.rs"

[[bin]]
name = "genetic_one_minute"
path = "src/bin/genetic_one_minute.rs"

[[bench]]
name = "simulator"
harness = false
path = "benches/simulator_bench.rs"

[[bench]]
name = "monte_carlo_parallel"
harness = false
path = "benches/monte_carlo_parallel_bench.rs"

[[bench]]
name = "simd_damage_kernel"
harness = false
path = "benches/simd_damage_kernel_bench.rs"

[[bench]]
name = "genetic_throughput"
harness = false
path = "benches/genetic_throughput_bench.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["macros"] }
calamine = "0.24"
chrono = { version = "0.4", default-features = false, features = ["std", "now"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.8", features = ["v4"] }
serde_yaml = "0.9"
lru = "0.12"
rayon = "1.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "compression-br", "compression-gzip", "trace"] }
futures-util = "0.3"
tokio-stream = "0.1"
getrandom = ">=0.2, <0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
schemars = { version = "0.8", features = ["chrono"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading"] }

[dev-dependencies]
criterion = "0.5"
jsonschema = "0.26"
proptest = "1"
serial_test = "3"
serde_yaml = "0.9"
tower = { version = "0.4", features = ["util"] }

# Faster local iteration: minimal debuginfo + quick optimizations for test/profile builds.
# `cargo test` and `cargo nextest run` both inherit from this profile.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Release builds: enable LTO, single codegen unit, abort on panic for max throughput.
# Compile times are significantly longer — dev iteration should use `profile.profiling`.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Release-grade optimizations with debuginfo for local profilers (samply, Instruments).
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[workspace]
members = ["xtask"]
resolver = "2"
