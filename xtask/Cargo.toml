[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
publish = false
description = "Maintenance task runner for the Kobayashi workspace (cargo xtask)"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "color"] }
kobayashi = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
