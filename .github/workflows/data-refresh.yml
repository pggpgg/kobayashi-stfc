# Scheduled + manual: refresh data.stfc.space caches, run stfc.space normalizers, test, open PR.
# Does not run --stfccommunity (PowerShell); see scripts/data-refresh.mjs.
name: Data refresh (stfc.space)

on:
  schedule:
    # Weekly Monday 06:00 UTC — ships use --full; hostiles/research missing-only by default
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      full_fetch:
        description: "Pass --full to ship, hostile, and research detail fetchers"
        type: boolean
        default: false
      dry_run:
        description: "Run fetch + normalize + tests but do not open a PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh upstream data and open PR
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: data-refresh-cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            data-refresh-cargo-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install npm dependencies (repo root)
        run: npm ci

      - name: Snapshot summary catalogs (pre-fetch)
        run: |
          set -euo pipefail
          mkdir -p /tmp/before
          for f in summary-ship.json summary-hostile.json summary-research.json; do
            src="data/upstream/data-stfc-space/${f}"
            if [ -f "$src" ]; then
              cp "$src" "/tmp/before/${f}"
            fi
          done

      - name: Fetch stfc.space catalog (summaries + translations)
        run: python3 scripts/fetch_stfcspace_page_upstream.py

      - name: Summary drift report (catalog fetch)
        run: |
          set -euo pipefail
          node scripts/check_stfcspace_summary_drift.mjs \
            --compare-dir /tmp/before \
            --markdown-out /tmp/summary_drift.md || true

      - name: Fetch ship / hostile / research detail JSON
        run: |
          set -euo pipefail
          SHIP_EXTRA=""
          HOSTILE_EXTRA=""
          RESEARCH_EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SHIP_EXTRA="--full"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.full_fetch }}" = "true" ]; then
            SHIP_EXTRA="--full"
            HOSTILE_EXTRA="--full"
            RESEARCH_EXTRA="--full"
          fi
          node scripts/fetch_stfcspace_ships.mjs ${SHIP_EXTRA}
          node scripts/fetch_stfcspace_hostiles.mjs ${HOSTILE_EXTRA}
          node scripts/fetch_stfcspace_research.mjs ${RESEARCH_EXTRA}

      - name: Run data refresh (core + stfc.space pipeline)
        run: npm run data:refresh -- --stfcspace

      - name: cargo test
        run: cargo test

      - name: Strict data validation
        run: cargo run --bin validate_data

      - name: Check normalized data diff
        run: |
          set -euo pipefail
          if git diff --quiet -- data/; then
            echo "No normalized data drift under data/; create-pull-request will skip if nothing changed."
          else
            echo "Normalized data changed; PR will be opened when enabled."
            git diff --stat -- data/ | tail -n 40
          fi

      - name: Assemble Pull Request body
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          {
            echo "Automated update from workflow **${{ github.workflow }}** ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
            echo ""
            if [ -f /tmp/summary_drift.md ]; then
              cat /tmp/summary_drift.md
              echo ""
            fi
            echo "## Pipeline"
            echo ""
            echo "- Catalog: \`python3 scripts/fetch_stfcspace_page_upstream.py\`"
            echo "- Detail fetch: \`fetch_stfcspace_ships.mjs\` (scheduled: **--full**), hostiles + research (missing-only unless manual **full_fetch**)"
            echo "- Normalize: \`npm run data:refresh -- --stfcspace\`"
            echo "- Verify: \`cargo test\` + \`cargo run --bin validate_data\`"
            echo ""
            echo "Please review large \`data/\` diffs before merge."
          } > /tmp/pr_body.md

      - name: Create Pull Request
        id: cpr
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): automated stfc.space refresh"
          title: "chore(data): automated stfc.space refresh"
          body-path: /tmp/pr_body.md
          branch: automated/data-refresh-${{ github.run_id }}
          delete-branch: true

      # Each run opens its own automated/data-refresh-<run_id> branch, so an older unmerged
      # refresh PR is strictly superseded: same pipeline, older upstream snapshot. Left open
      # they stack up (three deep by 2026-09-06) and actively mislead -- the oldest still
      # shows a red "Upstream summary drift" check, which reads as the refresh failing when
      # it only means that snapshot predates the current catalog. Only runs when this run
      # actually produced a PR: if nothing changed upstream, the existing PR is still the
      # valid pending refresh and must be left alone.
      - name: Close superseded refresh PRs
        if: ${{ steps.cpr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_PR: ${{ steps.cpr.outputs.pull-request-number }}
          NEW_PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          set -euo pipefail

          superseded=$(gh pr list --state open --limit 100 --json number,headRefName \
            | jq -r --argjson new "${NEW_PR}" '
                .[]
                | select(.headRefName | startswith("automated/data-refresh-"))
                | select(.number != $new)
                | .number')

          if [ -z "${superseded}" ]; then
            echo "No superseded refresh PRs open."
            exit 0
          fi

          # Heredoc at the script's base indentation so the rendered comment has no leading
          # whitespace -- indented markdown would turn the body into a code block.
          cat > /tmp/superseded.md <<EOF
          Superseded by #${NEW_PR} (${NEW_PR_URL}), opened by a later run of the same **Data refresh (stfc.space)** workflow.

          Every run fetches the current upstream catalog onto a fresh \`automated/data-refresh-<run_id>\` branch, so this PR holds an older snapshot of the same pipeline. Its \`Upstream summary drift\` check will stay red for that reason alone: it compares *this* branch against live upstream, not against the newer PR.

          Closing automatically so only one reviewable refresh stays open. Reopen if you need this specific snapshot.
          EOF

          echo "Superseding in favour of #${NEW_PR}:"
          for n in ${superseded}; do
            echo "  closing #${n}"
            gh pr comment "${n}" --body-file /tmp/superseded.md \
              || echo "  warning: could not comment on #${n}"
            gh pr close "${n}" --delete-branch \
              || echo "  warning: could not close #${n}"
          done
