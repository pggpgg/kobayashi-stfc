# Publishes prebuilt binaries + built SPA when a version tag is pushed (e.g. v0.1.0).
# Maintainers: tag a reviewed commit on main, then push it. Signed tags are encouraged:
#   git tag -s v0.1.0 -m "Release v0.1.0"
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release source and dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tag commit to belong to main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.93.1"
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo audit

  build:
    name: Build (${{ matrix.slug }})
    needs: [verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slug: linux-x86_64
            ext: tar.gz
          - os: macos-latest
            slug: macos-aarch64
            ext: tar.gz
          - os: windows-latest
            slug: windows-x86_64
            ext: zip

    env:
      REF: ${{ github.ref_name }}
      STAGE_DIR: kobayashi-${{ github.ref_name }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.93.1"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Criterion benchmark baseline log (linux only)
        if: matrix.slug == 'linux-x86_64'
        env:
          CI: "true"
          KOBAYASHI_RAYON_THREADS: "2"
        run: |
          set -euo pipefail
          cargo bench --bench simulator --bench monte_carlo_parallel -- --noplot
          cargo xtask bench-check --baseline benchmark_results.fresh.log --write-baseline

      - name: Upload benchmark baseline log artifact
        if: matrix.slug == 'linux-x86_64'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: benchmark-results-log
          path: benchmark_results.fresh.log

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble self-contained bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/release/kobayashi.exe ]; then
            BINARY=target/release/kobayashi.exe
          else
            BINARY=target/release/kobayashi
          fi
          node scripts/stage-release-bundle.mjs \
            --stage-dir "stage/${STAGE_DIR}" \
            --binary "$BINARY"

      - name: Smoke-test extracted-bundle layout
        run: node scripts/smoke-release-bundle.mjs --bundle-dir "stage/${{ env.STAGE_DIR }}"

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "kobayashi-${REF}-${{ matrix.slug }}.tar.gz" -C stage "${STAGE_DIR}"

      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "stage/${env:STAGE_DIR}" -DestinationPath "kobayashi-${env:REF}-${{ matrix.slug }}.zip"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-asset-${{ matrix.slug }}
          path: kobayashi-${{ github.ref_name }}-${{ matrix.slug }}.${{ matrix.ext }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release-assets
          pattern: release-asset-*
          merge-multiple: true

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: benchmark-results-log
          path: bench-download

      - name: Attach benchmark_results.log to release assets
        run: |
          set -euo pipefail
          cp bench-download/benchmark_results.fresh.log release-assets/benchmark_results.log

      - name: Write SHA256SUMS
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the release assets and checksum manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
