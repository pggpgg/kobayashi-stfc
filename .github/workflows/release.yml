# Publishes prebuilt binaries + built SPA when a version tag is pushed (e.g. v0.1.0).
# Maintainers: create an annotated or GPG-signed tag locally, then push it:
#   git tag -s v0.1.0 -m "Release v0.1.0"
#   git push origin v0.1.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.slug }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            slug: linux-x86_64
            ext: tar.gz
          - os: macos-latest
            slug: macos-aarch64
            ext: tar.gz
          - os: windows-latest
            slug: windows-x86_64
            ext: zip

    env:
      REF: ${{ github.ref_name }}
      STAGE_DIR: kobayashi-${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Criterion benchmark baseline log (linux only)
        if: matrix.slug == 'linux-x86_64'
        env:
          CI: "true"
          KOBAYASHI_RAYON_THREADS: "2"
        run: |
          set -euo pipefail
          cargo bench --bench simulator --bench monte_carlo_parallel -- --noplot
          cargo xtask bench-check --write-baseline benchmark_results.fresh.log

      - name: Upload benchmark baseline log artifact
        if: matrix.slug == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-log
          path: benchmark_results.fresh.log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble self-contained bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ -f target/release/kobayashi.exe ]; then
            BINARY=target/release/kobayashi.exe
          else
            BINARY=target/release/kobayashi
          fi
          node scripts/stage-release-bundle.mjs \
            --stage-dir "stage/${STAGE_DIR}" \
            --binary "$BINARY"

      - name: Smoke-test extracted-bundle layout
        run: node scripts/smoke-release-bundle.mjs --bundle-dir "stage/${{ env.STAGE_DIR }}"

      - name: Package (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "kobayashi-${REF}-${{ matrix.slug }}.tar.gz" -C stage "${STAGE_DIR}"

      - name: Package (zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Compress-Archive -Path "stage/${env:STAGE_DIR}" -DestinationPath "kobayashi-${env:REF}-${{ matrix.slug }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.slug }}
          path: kobayashi-${{ github.ref_name }}-${{ matrix.slug }}.${{ matrix.ext }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-asset-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: benchmark-results-log
          path: bench-download

      - name: Attach benchmark_results.log to release assets
        run: |
          set -euo pipefail
          cp bench-download/benchmark_results.fresh.log release-assets/benchmark_results.log

      - name: Write SHA256SUMS
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
