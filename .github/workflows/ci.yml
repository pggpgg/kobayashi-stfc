# Supply-chain policy (audit task 17):
# - Rust: `cargo audit` — FAIL on any RustSec advisory (non-zero exit).
# - npm: `npm audit --audit-level=high` — FAIL on high/critical only; moderate/low do not fail the job.
#
# CI quality (audit task 8):
# - Rust: `cargo fmt --check` (requires rustfmt); `cargo clippy --all-targets -- -D warnings`.
# - Frontend: Biome (`npm run lint`); TypeScript same policy as local builds (`npm run typecheck` = `tsc -b`; see frontend/tsconfig.json strict options).
#
# API contracts (audit task 7):
# - OpenAPI 3.1 YAML in `docs/openapi/kobayashi-openapi.yaml`; served at GET /api/openapi.yaml and /api/openapi.json; contract tests in `tests/openapi_contract_test.rs`, `tests/openapi_response_contract_test.rs`, and `tests/openapi_schema_parity_test.rs`.
#
# Static SPA (audit task 13):
# - `CompressionLayer` (gzip + brotli) on the Axum router; `Cache-Control` for `assets/*` (immutable) vs `index.html` (no-cache) in `src/server/routes.rs`.
#
# Coverage (roadmap task 11):
# - Parallel `rust_coverage` job: `cargo llvm-cov --lib --tests` with summary in logs + lcov artifact (no threshold gate).
# - Frontend job runs `npm run test:coverage` instead of plain `npm test`; uploads Vitest lcov (informational only).

name: CI

# Efficiency (2026-07-15): push triggers only on main — PR branches are covered by the
# pull_request event alone, so a branch push no longer starts two identical full runs
# (the push- and PR-triggered runs landed in different concurrency groups and neither
# cancelled the other). Rust caching uses Swatinem/rust-cache (re-saves each main run and
# prunes stale target/ artifacts — the old actions/cache key only saved when Cargo.lock
# changed, so restored caches grew stale, and unpruned caches have exhausted runner disk
# before). Coverage is main-only (informational, no threshold gate); the release build +
# cargo audit run as a parallel job off the test job's critical path.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # PRs restore from main's cache; only main runs save, keeping the cache
          # count bounded (runner disk has been exhausted by unpruned caches before).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: cargo nextest run
        # Includes CombatEffectSpec integration tests (research / LCARS / mixed).
        # nextest schedules tests across the ~30 integration-test binaries in parallel
        # (cargo test runs binaries sequentially); the sync-test serialization lives in
        # .config/nextest.toml. Doctests are not supported by nextest — run them separately.
        env:
          CI: true
        run: cargo nextest run --profile ci

      - name: cargo test --doc
        env:
          CI: true
        run: cargo test --doc

      - name: Research catalog integration tests
        env:
          CI: true
        run: cargo test --test scenario_research_integration_tests

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: npm run test:scripts
        run: npm run test:scripts

      - name: Mitigation calibration drift gate
        run: |
          set -o pipefail
          cargo test --test mitigation_feedback_calibration_tests mitigation_sensitivity_feedback_matches_drift_fixtures -- --nocapture \
            | tee mitigation-damage-through-drift-report.txt

      - name: Upload mitigation drift report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mitigation-damage-through-drift-report
          path: mitigation-damage-through-drift-report.txt
          retention-days: 21

      - name: Calibration scoreboard
        run: |
          set -o pipefail
          cargo xtask calibration-scoreboard | tee calibration-scoreboard.txt

      - name: Calibration scoreboard doc up to date
        run: |
          cargo xtask calibration-scoreboard --write --quiet
          git diff --exit-code docs/CALIBRATION_SCOREBOARD.md

      - name: Upload calibration scoreboard
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: calibration-scoreboard
          path: calibration-scoreboard.txt
          retention-days: 21

      - name: Generated data up to date
        run: cargo xtask check-generated

      - name: Strict data validation report
        run: |
          cargo run --bin validate_data -- \
            --json-out data_validation_report.json \
            --markdown-out data_validation_report.md

      - name: Upload data validation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: data-validation-report
          path: |
            data_validation_report.json
            data_validation_report.md
          retention-days: 21

  rust_release:
    name: Rust release build + audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo build --release
        run: cargo build --release

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1

      - name: cargo audit
        run: cargo audit

  rust_coverage:
    name: Rust coverage
    # Informational only (no threshold gate) — run on main, not on every PR push.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Rust coverage (lib + integration tests)
        env:
          CI: true
        run: |
          cargo llvm-cov --lib --tests \
            --lcov --output-path rust-lcov.info \
            --summary-only

      - name: Upload Rust coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: rust-coverage
          path: rust-lcov.info
          retention-days: 21

  upstream_drift:
    name: Upstream summary drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Check live summary catalogs vs committed
        run: node scripts/check_stfcspace_summary_drift.mjs --check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend lint (Biome)
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 21

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  combat_engine_python:
    name: Combat engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/combat_engine/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r tools/combat_engine/requirements-test.txt

      - name: Run tools/combat_engine tests
        run: python -m pytest tools/combat_engine/tests/ -v

  e2e_smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build backend (release)
        run: cargo build --release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Playwright E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
