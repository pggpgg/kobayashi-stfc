# Supply-chain policy (audit task 17):
# - Rust: `cargo audit` — FAIL on any RustSec advisory (non-zero exit).
# - npm: `npm audit --audit-level=high` — FAIL on high/critical only; moderate/low do not fail the job.
#
# CI quality (audit task 8):
# - Rust: `cargo fmt --check` (requires rustfmt); `cargo clippy --all-targets -- -D warnings`.
# - Frontend: Biome (`npm run lint`); TypeScript same policy as local builds (`npm run typecheck` = `tsc -b`; see frontend/tsconfig.json strict options).
#
# API contracts (audit task 7):
# - OpenAPI 3.0 YAML in `docs/openapi/kobayashi-heavy-payloads.yaml`; served at GET /api/openapi.yaml and /api/openapi.json; contract tests in `tests/openapi_contract_test.rs`.
#
# Static SPA (audit task 13):
# - `CompressionLayer` (gzip + brotli) on the Axum router; `Cache-Control` for `assets/*` (immutable) vs `index.html` (no-cache) in `src/server/routes.rs`.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        # Includes CombatEffectSpec integration tests (research / LCARS / mixed).
        run: cargo test

      - name: Strict data validation report
        run: |
          cargo run --bin validate_data -- \
            --json-out data_validation_report.json \
            --markdown-out data_validation_report.md

      - name: Upload data validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-validation-report
          path: |
            data_validation_report.json
            data_validation_report.md
          retention-days: 21

      - name: cargo build --release
        run: cargo build --release

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1

      - name: cargo audit
        run: cargo audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend lint (Biome)
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  combat_engine_python:
    name: Combat engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/combat_engine/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r tools/combat_engine/requirements-test.txt

      - name: Run tools/combat_engine tests
        run: python -m pytest tools/combat_engine/tests/ -v

  e2e_smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build backend (release)
        run: cargo build --release

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Playwright E2E smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
