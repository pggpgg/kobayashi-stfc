# Supply-chain policy (audit task 17):
# - Rust: `cargo audit` — FAIL on any RustSec advisory (non-zero exit).
# - npm: `npm audit --audit-level=high` — FAIL on high/critical only; moderate/low do not fail the job.
#
# CI quality (audit task 8):
# - Rust: `cargo fmt --check` (requires rustfmt).
# - Frontend: Biome (`npm run lint`); TypeScript same policy as local builds (`npm run typecheck` = `tsc -b`; see frontend/tsconfig.json strict options).
#
# API contracts (audit task 7):
# - OpenAPI 3.0 YAML in `docs/openapi/kobayashi-heavy-payloads.yaml`; served at GET /api/openapi.yaml and /api/openapi.json; contract tests in `tests/openapi_contract_test.rs`.
#
# Static SPA (audit task 13):
# - `CompressionLayer` (gzip + brotli) on the Axum router; `Cache-Control` for `assets/*` (immutable) vs `index.html` (no-cache) in `src/server/routes.rs`.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: cargo clippy
        run: cargo clippy --all-targets

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1

      - name: cargo audit
        run: cargo audit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Frontend lint (Biome)
        working-directory: frontend
        run: npm run lint

      - name: TypeScript check
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  combat_engine_python:
    name: Combat engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/combat_engine/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r tools/combat_engine/requirements-test.txt

      - name: Run tools/combat_engine tests
        run: python -m pytest tools/combat_engine/tests/ -v
