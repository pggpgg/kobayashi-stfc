name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

    - name: Run tests (CombatEffectSpec legacy research path)
      run: KOBAYASHI_COMBAT_EFFECT_SPEC_DISABLE=1 cargo test --verbose
