# Roadmap §1.4: cross-method optimizer benchmark — recall/regret gate plus a JSONL artifact.
#
# Not a PR gate. This runs the optimizer for real (minutes, not seconds), and unlike the Criterion
# job it measures search quality rather than speed, so it belongs on a schedule where a failure
# means "the optimizer got worse" instead of "the runner was busy". Dispatch it manually when a PR
# touches src/optimizer/.

name: Optimizer method bench

on:
  schedule:
    # Mondays 07:00 UTC, an hour after the data refresh, so a refresh-driven change shows up here.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimizer-method-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  method_bench:
    name: Recall and regret vs baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      KOBAYASHI_RAYON_THREADS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.93.1"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-methodbench-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-methodbench-cargo-

      - name: Run bench and compare to baseline
        id: gate
        run: |
          set -euo pipefail
          cargo xtask optimizer-bench-check \
            --jsonl-out optimizer-method-bench.jsonl \
            --markdown-out optimizer-method-bench.md

      - name: Summary
        if: always() && hashFiles('optimizer-method-bench.md') != ''
        run: cat optimizer-method-bench.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bench records
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: optimizer-method-bench
          path: |
            optimizer-method-bench.jsonl
            optimizer-method-bench.md
          if-no-files-found: warn
          retention-days: 90
