# OpenAPI 3.0 — heavy JSON request bodies (audit task 7).
# Served at GET /api/openapi.yaml and GET /api/openapi.json when the API is running.
# Profile scoping: query ?profile=<id> and/or header X-Profile-Id (see docs/DEPLOYMENT_SECURITY.md).

openapi: 3.0.3
info:
  title: Kobayashi STFC API — heavy payloads
  description: |
    Request and error shapes for CPU-heavy routes and large mod-sync ingress.
    Mutating routes may require `Authorization: Bearer` or `X-Api-Key` when `KOBAYASHI_API_KEY` is set;
    `/api/sync/ingress` uses `stfc-sync-token` instead. Optional debug GETs (e.g. CombatEffectSpec dump)
    are listed only when they are env-gated and useful for investigation. This document does not list every read-only GET.
  version: 0.1.0

servers:
  - url: /
    description: Same origin as the running kobayashi server

tags:
  - name: simulate
  - name: optimize
  - name: compare
  - name: sync
  - name: debug

paths:
  /api/simulate:
    post:
      tags: [simulate]
      summary: Monte Carlo simulation for one crew
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
            example:
              ship: Saladin
              hostile: "2918121098"
              ship_tier: 1
              ship_level: 50
              crew:
                captain: officer_id
                bridge: [null, null, null, null]
                below_deck: [null, null]
              num_sims: 5000
              seed: 0
              below_decks_slots: 3
      responses:
        "200":
          description: JSON with status, stats, seed, optional warnings
        "400":
          description: Invalid JSON or validation error (plain text or JSON)

  /api/optimize:
    post:
      tags: [optimize]
      summary: Synchronous crew optimization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeRequest"
            example:
              ship: Saladin
              hostile: "2918121098"
              sims: 5000
              strategy: genetic
              constraints:
                must_include: []
                exclude: []
                groups: []
      responses:
        "200":
          description: JSON recommendations and metadata
        "400":
          description: Parse error or structured validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/optimize/start:
    post:
      tags: [optimize]
      summary: Start async optimization (same JSON body as /api/optimize)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeRequest"
      responses:
        "200":
          description: JSON with job_id
        "400":
          description: Parse error or structured validation

  /api/compare/crews:
    post:
      tags: [compare]
      summary: Monte Carlo distributions for 2–5 crews
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareCrewsRequest"
            example:
              ship: Saladin
              hostile: "2918121098"
              crews:
                - captain: a
                  bridge: []
                  below_deck: []
                - captain: b
                  bridge: []
                  below_deck: []
              num_sims: 8000
      responses:
        "200":
          description: JSON with per-crew distributions
        "400":
          description: Invalid JSON or validation error

  /api/optimize/replay-seed:
    post:
      tags: [optimize]
      summary: Deterministic replay of one MC draw (combat trace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaySeedRequest"
      responses:
        "200":
          description: Trace JSON
        "400":
          description: Invalid request

  /api/debug/combat-effect-spec/officers/{id}:
    get:
      tags: [debug]
      summary: Optional LCARS → CombatEffectSpec JSON (local investigation)
      description: |
        Returns **404** unless the server was started with `KOBAYASHI_COMBAT_EFFECT_SPEC_DEBUG=1`
        (truthy). LCARS officers must be loaded (`KOBAYASHI_OFFICER_SOURCE=lcars` at startup), or the
        handler responds **404** with a distinct message. When enabled, each LCARS effect row may
        include an optional `spec` object when `lcars_effect_to_combat_effect_spec` maps the row.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Officer id or case-insensitive name match (same as `/api/officers/:id/resolved`)
      responses:
        "200":
          description: JSON with officer_id, combat_effect_spec_enabled, abilities[].effects[].spec
        "404":
          description: Debug disabled, LCARS not loaded, or officer not found

  /api/sync/ingress:
    post:
      tags: [sync]
      summary: STFC Community Mod sync batch (JSON array)
      description: |
        Body must be a top-level JSON array. Each element is an object with a `type` field
        (`officer`, `research`, `buildings`, `ships`, `ft`, `tech`, `buffs`, `expired_buffs`, `battlelogs`, etc.).
        See `docs/SYNC.md` and server tests in `src/server/sync.rs`.
      parameters:
        - name: stfc-sync-token
          in: header
          required: false
          schema:
            type: string
          description: Profile sync token (required for persistence; 401 if missing/invalid for profile)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncIngressBatch"
            examples:
              empty:
                value: []
      responses:
        "200":
          description: Batch accepted (check JSON body for per-type results)
        "400":
          description: Body is not a JSON array
        "401":
          description: Sync token missing or not mapped to a profile

components:
  schemas:
    NullableString:
      type: string
      nullable: true
      description: JSON null means empty slot

    SimulateCrew:
      type: object
      properties:
        captain:
          $ref: "#/components/schemas/NullableString"
        bridge:
          type: array
          items:
            $ref: "#/components/schemas/NullableString"
          description: Up to four bridge slots; null entries are empty
        below_deck:
          type: array
          items:
            $ref: "#/components/schemas/NullableString"
          description: Variable length; padded server-side to below-decks slot count

    SimulateRequest:
      type: object
      required: [ship, hostile, crew]
      properties:
        ship:
          type: string
        hostile:
          type: string
          description: Hostile id (numeric string or identifier from /api/hostiles)
        ship_tier:
          type: integer
          format: int32
          minimum: 1
        ship_level:
          type: integer
          format: int32
          minimum: 1
        crew:
          $ref: "#/components/schemas/SimulateCrew"
        num_sims:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: Defaults if omitted (server default 5000)
        seed:
          type: integer
          format: int64
        below_decks_slots:
          type: integer
          format: int32
          minimum: 2
          maximum: 5

    CompareCrewsRequest:
      type: object
      required: [ship, hostile, crews]
      properties:
        ship:
          type: string
        hostile:
          type: string
        ship_tier:
          type: integer
          format: int32
        ship_level:
          type: integer
          format: int32
        crews:
          type: array
          minItems: 2
          maxItems: 5
          items:
            $ref: "#/components/schemas/SimulateCrew"
        num_sims:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
        seed:
          type: integer
          format: int64
        below_decks_slots:
          type: integer
          format: int32
          minimum: 2
          maximum: 5
        proc_sample_trials:
          type: integer
          format: int32
          minimum: 0
          description: Traced trials per crew for proc-like rates; 0 skips

    OfficerGroupConstraintDto:
      type: object
      required: [officers, min_count]
      properties:
        officers:
          type: array
          items:
            type: string
        min_count:
          type: integer
          format: int32
          minimum: 0

    OptimizeConstraintsDto:
      type: object
      properties:
        must_include:
          type: array
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            $ref: "#/components/schemas/OfficerGroupConstraintDto"
        captain_must_be:
          type: string
        bridge_must_include:
          type: array
          items:
            type: string
        below_decks_must_include:
          type: array
          items:
            type: string

    WarmStartCrewDto:
      type: object
      required: [captain, bridge, below_decks]
      properties:
        captain:
          type: string
        bridge:
          type: array
          items:
            type: string
        below_decks:
          type: array
          items:
            type: string

    ChainGrindRequestDto:
      type: object
      properties:
        enabled:
          type: boolean
        kills_target:
          type: integer
          format: int32
          minimum: 1
          maximum: 50
        secondary:
          type: string
          description: min_hull_damage (default) or max_loot_per_hull_proxy

    OptimizeRequest:
      type: object
      required: [ship, hostile]
      properties:
        ship:
          type: string
        hostile:
          type: string
        ship_tier:
          type: integer
          format: int32
        ship_level:
          type: integer
          format: int32
        sims:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
        seed:
          type: integer
          format: int64
        max_candidates:
          type: integer
          format: int32
        strategy:
          type: string
          description: >-
            Omit to let the server auto-pick tiered vs exhaustive from candidate count;
            or set exhaustive, genetic, or tiered explicitly.
        prioritize_below_decks_ability:
          type: boolean
        heuristics_seeds:
          type: array
          items:
            type: string
        heuristics_only:
          type: boolean
        fast_discovery:
          type: boolean
          description: >-
            When true with non-empty heuristics_seeds, merge expanded seed crews into the optimizer
            warm-start list (approximate analytical rank, then Monte Carlo) instead of running full
            sims on every seed crew before the main search. Incompatible with heuristics_only or
            strategy genetic.
        below_decks_strategy:
          type: string
          description: ordered (default) or exploration
        analytical_prefilter_keep:
          type: integer
          format: int32
          minimum: 1
          description: Truncate candidates after analytical ranking (non-genetic paths)
        tiered_scout_sims:
          type: integer
          format: int32
          minimum: 1
          maximum: 100000
          description: Tiered only — scout-phase sims per crew (server default 500)
        tiered_top_k:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          description: Tiered only — how many scout leaders get full confirmation sims (default 20)
        warm_start_crews:
          type: array
          items:
            $ref: "#/components/schemas/WarmStartCrewDto"
          description: Prepended before generated candidates (deduped server-side)
        below_decks_slots:
          type: integer
          format: int32
          minimum: 2
          maximum: 5
        constraints:
          $ref: "#/components/schemas/OptimizeConstraintsDto"
        support_buffs:
          type: array
          items:
            type: string
        chain:
          $ref: "#/components/schemas/ChainGrindRequestDto"
        defender_opponent:
          type: string
        novelty_lambda:
          type: number
          format: float
          description: Optional MMR blend in (0,1] — reorders the recommendation head for officer-set diversity versus pure win rate
        novelty_diverse_top:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
        novelty_pool:
          type: integer
          format: int32
          minimum: 2
          maximum: 10000

    ReplaySeedCrew:
      type: object
      properties:
        captain:
          $ref: "#/components/schemas/NullableString"
        bridge:
          type: array
          items:
            $ref: "#/components/schemas/NullableString"
        below_deck:
          type: array
          items:
            $ref: "#/components/schemas/NullableString"

    ReplaySeedRequest:
      type: object
      required: [ship, hostile, sim_index, crew]
      properties:
        ship:
          type: string
        hostile:
          type: string
        ship_tier:
          type: integer
          format: int32
        ship_level:
          type: integer
          format: int32
        seed:
          type: integer
          format: int64
          description: Scenario seed from optimize/simulate (default 0)
        sim_index:
          type: integer
          format: int64
          description: Zero-based MC iteration index
        max_trace_events:
          type: integer
          format: int32
          description: Cap on trace events (default 500, max 2000)
        crew:
          $ref: "#/components/schemas/ReplaySeedCrew"

    SyncIngressBatch:
      type: array
      items:
        type: object
        additionalProperties: true
        description: Must include string field `type` for routing

    ValidationIssue:
      type: object
      properties:
        field:
          type: string
        messages:
          type: array
          items:
            type: string

    ValidationErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"
