# OpenAPI 3.1 — full Kobayashi HTTP API (task 14).
# Served at GET /api/openapi.yaml and GET /api/openapi.json.
# Profile scoping: query ?profile=<id> and/or header X-Profile-Id (see docs/DEPLOYMENT_SECURITY.md).
# When KOBAYASHI_API_KEY is set, mutating routes (except /api/sync/ingress) require Authorization: Bearer <key> or X-Api-Key from non-loopback peers.

openapi: 3.1.0
info:
  title: Kobayashi STFC API
  description: |
    Monte Carlo combat simulation, crew optimization, profiles, presets, and sync ingress.
    Mutating routes may require `Authorization: Bearer` or `X-Api-Key` when `KOBAYASHI_API_KEY` is set;
    `/api/sync/ingress` uses `stfc-sync-token` instead (see `docs/SYNC.md`).
    CPU-heavy routes can return HTTP 503 with `code: cpu_busy` and `Retry-After`.
  version: 1.0.0

servers:
  - url: /
    description: Same origin as the running kobayashi server

tags:
  - name: meta
  - name: catalog
  - name: profile
  - name: presets
  - name: simulate
  - name: optimize
  - name: compare
  - name: sensitivity
  - name: sync
  - name: debug

security: []

paths:
  /api/openapi.yaml:
    get:
      tags: [meta]
      summary: Bundled OpenAPI document (YAML)
      responses:
        "200":
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

  /api/openapi.json:
    get:
      tags: [meta]
      summary: Bundled OpenAPI document (JSON)
      responses:
        "200":
          description: OpenAPI as JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "500":
          description: Failed to serialize YAML to JSON

  /api/health:
    get:
      tags: [meta]
      summary: Liveness and build/data signals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/mechanics/coverage:
    get:
      tags: [meta]
      summary: LCARS / mechanics coverage snapshot
      responses:
        "200":
          description: Coverage JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MechanicsCoverageResponse"

  /api/debug/combat-effect-spec/officers/{id}:
    get:
      tags: [debug]
      summary: Optional LCARS → CombatEffectSpec JSON (local investigation)
      description: |
        Returns **404** unless `KOBAYASHI_COMBAT_EFFECT_SPEC_DEBUG=1`. LCARS officers must be loaded.
      parameters:
        - $ref: "#/components/parameters/PathOfficerId"
      responses:
        "200":
          description: Debug payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Debug disabled or officer not found

  /api/officers:
    get:
      tags: [catalog]
      summary: List officers (optionally roster-filtered)
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
        - name: owned_only
          in: query
          schema:
            type: string
          description: When `1` or `true`, only officers present in the profile roster import.
      responses:
        "200":
          description: Officer list envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfficersListResponse"

  /api/officers/{id}/resolved:
    get:
      tags: [catalog]
      summary: Resolved officer JSON (LCARS path)
      parameters:
        - $ref: "#/components/parameters/PathOfficerId"
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      responses:
        "200":
          description: Resolved officer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Unknown officer

  /api/ships:
    get:
      tags: [catalog]
      summary: List ships
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
        - name: owned_only
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipsListResponse"

  /api/ships/{ship_id}/tiers-levels:
    get:
      tags: [catalog]
      summary: Tier/level grid and crew slot unlocks for a ship id
      parameters:
        - name: ship_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipTiersLevelsResponse"
        "404":
          description: Unknown ship id

  /api/hostiles:
    get:
      tags: [catalog]
      summary: List hostiles
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostilesListResponse"

  /api/data/version:
    get:
      tags: [catalog]
      summary: Data / mechanics version summary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataVersionResponse"

  /api/forbidden-tech:
    get:
      tags: [catalog]
      summary: Forbidden/chaos tech catalog for UI
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenTechCatalogResponse"

  /api/profile:
    get:
      tags: [profile]
      summary: Load merged player profile JSON
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Profile not found
    put:
      tags: [profile]
      summary: Replace player profile JSON
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkMessageResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/profile/buildings-summary:
    get:
      tags: [profile]
      summary: Synced building levels and combat bonuses
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/profile/forbidden-tech-imported:
    get:
      tags: [profile]
      summary: Synced forbidden/chaos tech inventory (imported)
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/profile/research-summary:
    get:
      tags: [profile]
      summary: Synced research and combat bonuses
      description: |
        Flat, owner-faction, and conditional research slices plus optional scenario-effective totals
        when both `ship_id` and `hostile_id` resolve in the data registry.
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
        - name: ship_id
          in: query
          required: false
          schema:
            type: string
          description: Attacker ship id or name for scenario-effective totals
        - name: hostile_id
          in: query
          required: false
          schema:
            type: string
          description: Defender hostile id or name for scenario-effective totals
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/profiles:
    get:
      tags: [profile]
      summary: List profiles (index)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilesListResponse"
    post:
      tags: [profile]
      summary: Create a profile
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileEntry"

  /api/profiles/export:
    get:
      tags: [profile]
      summary: Download profiles tree as zip
      responses:
        "200":
          description: application/zip bytes
          content:
            application/zip:
              schema:
                type: string
                format: binary

  /api/profiles/import:
    post:
      tags: [profile]
      summary: Restore profiles tree from Kobayashi export zip (destructive)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkMessageResponse"

  /api/profiles/{id}:
    delete:
      tags: [profile]
      summary: Delete a profile
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkMessageResponse"

  /api/presets:
    get:
      tags: [presets]
      summary: List presets for profile
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresetsListResponse"
    post:
      tags: [presets]
      summary: Save a preset
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Preset"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkMessageResponse"

  /api/presets/{id}:
    get:
      tags: [presets]
      summary: Load one preset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preset"
        "404":
          description: Preset not found

  /api/heuristics:
    get:
      tags: [optimize]
      summary: List heuristic seed names
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeuristicsListResponse"

  /api/optimize/estimate:
    get:
      tags: [optimize]
      summary: Estimate candidate count and wall time
      parameters:
        - name: ship
          in: query
          required: true
          schema:
            type: string
        - name: hostile
          in: query
          required: true
          schema:
            type: string
        - name: sims
          in: query
          schema:
            type: integer
        - name: max_candidates
          in: query
          schema:
            type: integer
        - name: below_decks_pool_mode
          in: query
          description: >
            Below-decks pool tier — `strict` (combat modifier only — default), `scored` (all
            below-decks-ability officers ranked by combat relevance with officer power as tiebreaker),
            or `relaxed` (all officers, ranked by power). Unknown values fall back to strict.
          schema:
            type: string
            enum: [strict, scored, relaxed]
        - name: ship_tier
          in: query
          schema:
            type: integer
        - name: ship_level
          in: query
          schema:
            type: integer
        - name: below_decks_slots
          in: query
          schema:
            type: integer
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeEstimateResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /api/optimize/status/{job_id}:
    get:
      tags: [optimize]
      summary: Poll async optimize job
      parameters:
        - $ref: "#/components/parameters/PathJobId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeStatusResponse"
        "404":
          description: Unknown job

  /api/optimize/jobs/{job_id}/stream:
    get:
      tags: [optimize]
      summary: SSE progress stream until job completes
      parameters:
        - $ref: "#/components/parameters/PathJobId"
      responses:
        "200":
          description: text/event-stream of JSON event payloads
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event `data:` line is JSON with fields such as status, progress, phase, result (when done).

  /api/optimize/jobs/{job_id}/cancel:
    post:
      tags: [optimize]
      summary: Request cancellation of async optimize job
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathJobId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkMessageResponse"

  /api/sync/status:
    get:
      tags: [sync]
      summary: Roster sync file status for profile
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/sync/ingress:
    post:
      tags: [sync]
      summary: STFC Community Mod sync batch (JSON array)
      security:
        - SyncToken: []
      parameters:
        - name: stfc-sync-token
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncIngressBatch"
      responses:
        "200":
          description: Per-type batch results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Body is not a JSON array
        "401":
          description: Invalid or missing sync token for persistence
        "500":
          description: Failed to persist the synced payload

  /api/officers/import:
    post:
      tags: [catalog]
      summary: Import officers (CSV or Spock JSON)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkMessageResponse"
        "400":
          description: Parse/validation error

  /api/simulate:
    post:
      tags: [simulate]
      summary: Monte Carlo simulation for one crew
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateResponse"
        "400":
          description: Invalid JSON or validation
        "503":
          description: CPU saturated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/compare/crews:
    post:
      tags: [compare]
      summary: Monte Carlo distributions for 2–5 crews
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompareCrewsRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompareCrewsResponse"
        "400":
          description: Validation error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/sensitivity:
    post:
      tags: [sensitivity]
      summary: Stat-level Δ-on-outcome sensitivity analysis (paired CRN Monte Carlo)
      description: |
        For a fixed scenario (crew + ship + research + hostile + profile + support buffs),
        perturbs each stat in the catalog by a per-stat δ and measures how the outcome
        metric changes. Uses paired Common Random Numbers (same seed sequence for baseline
        and perturbed runs) so per-seed differences cancel most of the variance. Returns one
        row per stat with a 95% confidence interval on the paired mean difference; rows
        whose CI excludes zero are flagged `significant: true`.
        Synchronous v1 — long runs are gated by the process-wide CPU admission semaphore.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitivityRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitivityResponse"
        "400":
          description: Validation or parse error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/sensitivity/defaults:
    get:
      tags: [sensitivity]
      summary: Default per-stat δ catalog (15 stats)
      description: |
        Returns the default δ each stat is perturbed by when the request body omits an override.
        `multiplicative: true` means the engine applies `value *= 1 + δ`; `false` means
        `value += δ`. UI uses this to format the override input appropriately.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitivityDefaultsResponse"

  /api/sensitivity/morris:
    post:
      tags: [sensitivity]
      summary: Morris-method screening sensitivity (random trajectories, μ\*/σ)
      description: |
        Walks `r` random trajectories through stat space (cumulative perturbations applied in
        random order). Each trajectory yields one elementary effect (EE) per stat via paired
        CRN Monte Carlo at each `k+1` step. Aggregates across trajectories into per-stat
        **μ\*** (importance, mean of `|EE|`), **μ** (signed direction), and **σ** (interaction
        signal — high σ relative to μ\* means the stat's effect depends on other stats).
        Screening method: σ flags interactions but does not identify specific pairs.
        Synchronous — gated by the CPU admission semaphore. Compute is `r × (k+1) × num_sims`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MorrisSensitivityRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MorrisSensitivityResponse"
        "400":
          description: Validation or parse error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/sensitivity/morris/defaults:
    get:
      tags: [sensitivity]
      summary: Morris defaults (δ catalog + r/sims defaults & caps)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MorrisSensitivityDefaultsResponse"

  /api/sensitivity/sobol:
    post:
      tags: [sensitivity]
      summary: Sobol variance-based sensitivity (Saltelli design, Jansen estimators)
      description: |
        Decomposes the variance of the outcome metric into per-stat contributions.
        Reports **S_i** (first-order: main effect alone), **S_T_i** (total-order:
        main + all interactions involving i), and **interaction strength** (S_T_i − S_i).
        v1 ships first-order and total-order indices; per-pair S_ij is planned (Sobol
        pairwise needs `N × k(k−1)/2` more evaluations).
        Synchronous — gated by the CPU admission semaphore.
        Compute is `N × (k + 2)` engine calls (`N=512`, `k=18` → ~10k sims by default).
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SobolSensitivityRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobolSensitivityResponse"
        "400":
          description: Validation or parse error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/sensitivity/sobol/defaults:
    get:
      tags: [sensitivity]
      summary: Sobol defaults (δ catalog + N defaults & caps)
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SobolSensitivityDefaultsResponse"

  /api/optimize:
    post:
      tags: [optimize]
      summary: Synchronous crew optimization
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/optimize/replay-seed:
    post:
      tags: [optimize]
      summary: Deterministic replay of one MC draw (combat trace)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaySeedRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid request
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/optimize/start:
    post:
      tags: [optimize]
      summary: Start async optimization (same JSON as /api/optimize)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueryProfile"
        - $ref: "#/components/parameters/HeaderProfileId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizeRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizeStartResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/sensitivity/start:
    post:
      tags: [sensitivity]
      summary: Start async OAT sensitivity job (same JSON as /api/sensitivity)
      description: |
        Returns a `job_id` immediately. Poll `GET /api/sensitivity/jobs/{job_id}/status`
        or subscribe to the SSE stream at `GET /api/sensitivity/jobs/{job_id}/stream`
        for live progress and the final result.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitivityRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitivityStartResponse"
        "400":
          description: Invalid request body
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/sensitivity/morris/start:
    post:
      tags: [sensitivity]
      summary: Start async Morris-screening job (same JSON as /api/sensitivity/morris)
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MorrisSensitivityRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitivityStartResponse"
        "400":
          description: Invalid request body
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/sensitivity/sobol/start:
    post:
      tags: [sensitivity]
      summary: Start async Sobol variance-decomposition job (same JSON as /api/sensitivity/sobol)
      description: |
        Especially useful with `include_pairwise: true` — the pairwise compute budget is
        `N × k(k − 1)/2` extra sims (≈ 8.6× at defaults), which is meaningfully slow
        synchronously. Async + SSE lets the UI stream progress and offer cancel.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SobolSensitivityRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitivityStartResponse"
        "400":
          description: Invalid request body
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CpuBusyError"

  /api/sensitivity/jobs/{job_id}/status:
    get:
      tags: [sensitivity]
      summary: One-shot status snapshot of a sensitivity job
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensitivityStatusResponse"
        "404":
          description: Job not found

  /api/sensitivity/jobs/{job_id}/stream:
    get:
      tags: [sensitivity]
      summary: SSE stream of sensitivity job progress until done or error
      description: |
        Emits a JSON-encoded `SensitivityStatusResponse` every ~300ms. The final event
        carries `status: "done"` (or `status: "error"`) and a full `result` payload
        whose shape matches the method-specific response (`SensitivityResponse`,
        `MorrisSensitivityResponse`, or `SobolSensitivityResponse`) — discriminate via
        the `method` field on the wrapper.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/sensitivity/jobs/{job_id}/cancel:
    post:
      tags: [sensitivity]
      summary: Request cancellation of a running sensitivity job
      description: |
        Idempotent. The worker checks the cancel flag at phase boundaries (e.g. between
        the A and B sample matrices, between first-order and pairwise) and returns
        early. In-flight Rayon work in the current phase still completes — Rayon doesn't
        natively support early termination of in-flight parallel iterators.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: job_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancel requested
        "404":
          description: Job not found

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
    BearerAuth:
      type: http
      scheme: bearer
    SyncToken:
      type: apiKey
      in: header
      name: stfc-sync-token

  parameters:
    QueryProfile:
      name: profile
      in: query
      schema:
        type: string
      description: Profile id (alternative to X-Profile-Id)
    HeaderProfileId:
      name: X-Profile-Id
      in: header
      required: false
      schema:
        type: string
    PathOfficerId:
      name: id
      in: path
      required: true
      schema:
        type: string
    PathJobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string

  schemas:
    CpuBusyError:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: string
          const: error
        code:
          type: string
          const: cpu_busy
        message:
          type: string
        retry_after_ms:
          type: number

    OkMessageResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        message:
          type: string

    HealthResponse:
      type: object
      required: [status, service, build, server, data]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        build:
          type: object
          required: [cargo_pkg_version]
          properties:
            cargo_pkg_version:
              type: string
            git_sha_short:
              type: ["string", "null"]
        server:
          type: object
          required:
            - started_at_utc
            - max_concurrent_cpu_jobs
            - max_concurrent_cpu_jobs_from_env
            - cpu_job_permits_available
            - cpu_job_permits_total
            - cpu_job_queue_wait_ms
            - cpu_job_queue_wait_ms_from_env
          properties:
            started_at_utc:
              type: string
            max_concurrent_cpu_jobs:
              type: integer
            max_concurrent_cpu_jobs_from_env:
              type: boolean
            cpu_job_permits_available:
              type: integer
            cpu_job_permits_total:
              type: integer
            cpu_job_queue_wait_ms:
              type: ["integer", "null"]
            cpu_job_queue_wait_ms_from_env:
              type: boolean
        data:
          type: object
          required:
            - officer_count
            - hostile_index_loaded
            - ship_index_loaded
          properties:
            officer_count:
              type: integer
              minimum: 0
            hostile_data_version:
              type: ["string", "null"]
            ship_data_version:
              type: ["string", "null"]
            hostile_index_loaded:
              type: boolean
            ship_index_loaded:
              type: boolean

    MechanicsCoverageResponse:
      type: object
      required:
        - status
        - lcars_officers_files
        - lcars_effects
        - ship_hull_abilities
        - ships_with_abilities_scanned
        - hostile_catalog_entries
        - hostile_catalog_entry_count
        - hostile_upstream_unique_ability_ids
        - hostile_catalog_modeled_count
        - hostile_catalog_noop_count
        - hostile_upstream_ids_missing_from_catalog
        - lcars_by_effect_type
        - lcars_ignored_samples
        - fidelity_backlog
        - notes
      properties:
        status:
          type: string
          const: ok
        lcars_officers_files:
          type: integer
        lcars_effects:
          $ref: "#/components/schemas/MechanicsTierCounts"
        ship_hull_abilities:
          $ref: "#/components/schemas/MechanicsTierCounts"
        ships_with_abilities_scanned:
          type: integer
        hostile_catalog_entries:
          $ref: "#/components/schemas/MechanicsTierCounts"
        hostile_catalog_entry_count:
          type: integer
        hostile_upstream_unique_ability_ids:
          type: integer
        hostile_catalog_modeled_count:
          type: integer
        hostile_catalog_noop_count:
          type: integer
        hostile_upstream_ids_missing_from_catalog:
          type: integer
        lcars_by_effect_type:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MechanicsTierCounts"
        lcars_ignored_samples:
          type: array
          items:
            type: string
        fidelity_backlog:
          type: array
          items:
            $ref: "#/components/schemas/MechanicsFidelityBacklogItem"
        notes:
          type: array
          items:
            type: string

    MechanicsTierCounts:
      type: object
      required: [implemented, partial, ignored]
      properties:
        implemented:
          type: integer
        partial:
          type: integer
        ignored:
          type: integer

    MechanicsFidelityBacklogItem:
      type: object
      required: [rank, area, key, ignored, partial, implemented, summary]
      properties:
        rank:
          type: integer
        area:
          type: string
        key:
          type: string
        ignored:
          type: integer
        partial:
          type: integer
        implemented:
          type: integer
        summary:
          type: string

    DataVersionResponse:
      type: object
      required: [mechanics]
      properties:
        officer_version:
          type: ["string", "null"]
        hostile_version:
          type: ["string", "null"]
        ship_version:
          type: ["string", "null"]
        mechanics:
          deprecated: true
          description: >-
            Legacy coarse summary retained for compatibility. Use
            GET /api/mechanics/coverage for live resolver-backed coverage.
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
              status:
                type: string

    OfficersListResponse:
      type: object
      required: [officers]
      properties:
        officers:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
              slot:
                type: ["string", "null"]
            additionalProperties: true

    ShipsListResponse:
      type: object
      required: [ships]
      properties:
        ships:
          type: array
          items:
            type: object
            required: [id, ship_name, ship_class]
            properties:
              id:
                type: string
              ship_name:
                type: string
              ship_class:
                type: string
              tier:
                type: integer
              level:
                type: integer
            additionalProperties: true

    HostilesListResponse:
      type: object
      required: [hostiles]
      properties:
        hostiles:
          type: array
          items:
            type: object
            required: [id, hostile_name, level, ship_class]
            properties:
              id:
                type: string
              hostile_name:
                type: string
              display_name:
                type: string
              level:
                type: integer
              ship_class:
                type: string
            additionalProperties: true

    ShipTiersLevelsResponse:
      type: object
      required: [tiers, levels]
      properties:
        tiers:
          type: array
          items:
            type: integer
        levels:
          type: array
          items:
            type: integer
        crew_slots:
          type: array
          items:
            type: object
            additionalProperties: true

    ForbiddenTechCatalogResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    ProfilesListResponse:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileEntry"
        default_id:
          type: ["string", "null"]

    ProfileEntry:
      type: object
      required: [id, name, sync_token]
      properties:
        id:
          type: string
        name:
          type: string
        sync_token:
          type: string
        is_default:
          type: boolean
          description: Present and true for the index default profile entry.

    CreateProfileRequest:
      type: object
      required: [name]
      properties:
        id:
          type: string
        name:
          type: string

    PresetsListResponse:
      type: object
      required: [presets]
      properties:
        presets:
          type: array
          items:
            type: object
            required: [id, name, ship, scenario, schema_version]
            properties:
              id:
                type: string
              name:
                type: string
              ship:
                type: string
              scenario:
                type: string
              schema_version:
                type: integer
            additionalProperties: true

    Preset:
      type: object
      required: [id, name, ship, scenario, crew, schema_version, provenance]
      properties:
        schema_version:
          type: integer
        id:
          type: string
        name:
          type: string
        ship:
          type: string
        scenario:
          type: string
        crew:
          type: object
          additionalProperties: true
        provenance:
          type: object
          additionalProperties: true

    HeuristicsListResponse:
      type: object
      required: [seeds]
      properties:
        seeds:
          type: array
          items:
            type: string

    OptimizeEstimateResponse:
      type: object
      required: [estimated_candidates, sims_per_crew, estimated_seconds]
      properties:
        estimated_candidates:
          type: integer
          minimum: 0
        sims_per_crew:
          type: integer
        estimated_seconds:
          type: number

    OptimizeStartResponse:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string

    SensitivityStartResponse:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          description: |
            Job id with shape `sens_<method>_<millis>_<counter>` where `<method>` is
            `oat`, `morris`, or `sobol`. Use it to poll status or subscribe to the SSE
            stream.

    SensitivityStatusResponse:
      type: object
      required: [status, method]
      properties:
        status:
          type: string
          enum: [running, done, error]
        method:
          type: string
          enum: [oat, morris, sobol]
          description: Which sensitivity engine produced this job.
        progress:
          type: integer
          description: 0–100. Computed from sims_done / total_sims.
        sims_done:
          type: integer
          description: Atomic counter of completed sims. Updates throttled to one per 64 sims to limit registry-lock contention.
        total_sims:
          type: integer
          description: Total sim budget for the job (resolved at engine start once k / N / r are known).
        phase:
          type: string
          description: |
            Current engine phase. OAT — `baseline` then `per_stat_perturbation`. Morris —
            `trajectories`. Sobol — `sample_a`, `sample_b`, `first_order`, optionally
            `pairwise`.
        throughput_sims_per_sec:
          type: number
          description: Best-effort sims/sec from sims_done and elapsed wall time. Null when sims_done is 0 or status is not running.
        eta_seconds:
          type: integer
          description: Estimated remaining seconds; null when throughput cannot be computed.
        result:
          description: |
            Full method-specific result on completion. Tagged by `method` (`oat`,
            `morris`, `sobol`) so clients can route to `SensitivityResponse`,
            `MorrisSensitivityResponse`, or `SobolSensitivityResponse` respectively.
          type: object
          additionalProperties: true
        error:
          type: string

    OptimizeStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        progress:
          type: integer
        crews_done:
          type: integer
        total_crews:
          type: integer
        phase:
          type: string
        throughput_crews_per_sec:
          type: number
        eta_seconds:
          type: integer
        progress_preview:
          type: array
          items:
            type: object
            additionalProperties: true
        result:
          description: Present when status is done; same shape as synchronous /api/optimize response
          type: object
          additionalProperties: true
        error:
          type: string

    OptimizeResponse:
      type: object
      required: [status, engine, scenario, recommendations, notes]
      properties:
        status:
          type: string
        engine:
          type: string
        scenario:
          type: object
          additionalProperties: true
        recommendations:
          type: array
          items:
            type: object
            additionalProperties: true
            description: >
              Ranked crew row. Monte Carlo strategies populate win/stall/loss rates and CIs.
              `linear_eval` sets `expected_hull_damage` and leaves win-rate fields at zero.
            properties:
              expected_hull_damage:
                type: number
                description: >
                  Closed-form expected total hull damage over the fight (linear_eval only).
        duration_ms:
          type: integer
        notes:
          type: array
          items:
            type: string
        approximate_notes:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    NullableString:
      type: ["string", "null"]
      description: JSON null means empty slot

    SimulateCrew:
      type: object
      properties:
        captain:
          $ref: "#/components/schemas/NullableString"
        bridge:
          type: array
          items:
            $ref: "#/components/schemas/NullableString"
        below_deck:
          type: array
          items:
            $ref: "#/components/schemas/NullableString"

    SimulateRequest:
      type: object
      required: [ship, hostile, crew]
      properties:
        ship:
          type: string
        hostile:
          type: string
        ship_tier:
          type: integer
          minimum: 1
        ship_level:
          type: integer
          minimum: 1
        crew:
          $ref: "#/components/schemas/SimulateCrew"
        num_sims:
          type: integer
          minimum: 1
          maximum: 100000
        seed:
          type: integer
          format: int64
        below_decks_slots:
          type: integer
          minimum: 2
          maximum: 5
        support_buffs:
          type: array
          items:
            type: string
        defender_support_buffs:
          type: array
          items:
            type: string
          description: >
            PvP only: defender alliance support buff ids (Fortify, Defiant Reinforce). When present,
            `support_buffs` is treated as attacker-only for static routing.
        defender_alliance_debuffs:
          type: array
          items:
            type: string
          description: >
            PvP only: alliance debuffs applied to the attacker (e.g. Mantis sting when modeled).
        chain:
          $ref: "#/components/schemas/ChainGrindRequestDto"
        defender_opponent:
          type: string
        defender_crew:
          $ref: "#/components/schemas/SimulateCrew"
          description: >
            Optional LCARS crew for the defending combatant (merged with hostile ship abilities in PvE).
            Same shape as `crew`. Non-empty `captain` required when any bridge or below_deck slot is set;
            omitted or empty = defender officers from hostile data only.
        defender_ship:
          type: string
          description: >
            Player defender ship id (ships_extended). Mutually exclusive with `hostile`.
            Requires `defender_profile_id` (opponent account profile, not the attacker profile header).
        defender_ship_tier:
          type: integer
          minimum: 1
        defender_ship_level:
          type: integer
          minimum: 1
        defender_profile_id:
          type: string
          description: Opponent profile id when `defender_ship` is set.
        enemy_type:
          type: string
          description: >-
            Combat scenario for officer eligibility (snake_case EnemyType, e.g.
            `mission_bosses`, `solo_armadas`, `pvp_space`). Inferred from the target when unset.

    SimulateStats:
      type: object
      required:
        - win_rate
        - stall_rate
        - loss_rate
        - avg_hull_remaining
        - avg_defender_hull_remaining
        - n
      properties:
        win_rate:
          type: number
        stall_rate:
          type: number
        loss_rate:
          type: number
        avg_hull_remaining:
          type: number
        avg_defender_hull_remaining:
          type: number
        n:
          type: integer
        win_rate_95_ci:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number

    SimulateResponse:
      type: object
      required: [status, stats, seed]
      properties:
        status:
          type: string
        stats:
          $ref: "#/components/schemas/SimulateStats"
        seed:
          type: integer
          format: int64
        warnings:
          type: array
          items:
            type: string
        unresolved_officers:
          type: array
          description: >-
            Crew officers that did not resolve to an LCARS combat definition (so they
            contributed no effects). Omitted when empty; a non-empty list signals a
            canonical-to-LCARS gap rather than normal operation.
          items:
            type: string
        eligibility_notes:
          type: array
          description: >-
            Per-officer eligibility verdicts for the resolved scenario (does-not-work or
            conditional). Interpretability only — never affects the simulation. Omitted when empty.
          items:
            type: object
            properties:
              officer:
                type: string
              slot:
                type: string
              verdict:
                type: string
              reason:
                type: string
              ability_id:
                type: string

    SensitivityRequest:
      type: object
      required: [ship, hostile]
      properties:
        ship:
          type: string
          description: Ship id (e.g. `uss_enterprise_d`).
        hostile:
          type: string
          description: Hostile id or normalized name+level.
        ship_tier:
          type: integer
        ship_level:
          type: integer
        captain:
          type: string
        bridge:
          type: array
          items: { type: string }
        below_decks:
          type: array
          items: { type: string }
        support_buffs:
          type: array
          items: { type: string }
        profile_id:
          type: string
          description: Profile id (header / query also accepted).
        num_sims:
          type: integer
          minimum: 2
          maximum: 50000
          description: Paired sims per stat (also used for the baseline). Clamped server-side.
        seed:
          type: integer
          format: int64
        rounds:
          type: integer
        metric:
          type: string
          enum: [hull_remaining, win_rate, rounds_to_kill, defender_hull_remaining]
          description: Outcome scalar each stat's Δ is measured against. Default `hull_remaining`.
        deltas:
          type: object
          additionalProperties:
            type: number
          description: |
            Per-stat δ overrides. Keys are stat names (snake_case). A value of `0.0`
            skips that stat from the report. Missing keys use the default δ catalog.

    SensitivityRow:
      type: object
      required: [stat, delta_applied, mean_diff, ci95_low, ci95_high, significant]
      properties:
        stat:
          type: string
        delta_applied:
          type: number
        mean_diff:
          type: number
          description: Mean of `(perturbed - baseline)` per-seed metric values.
        mean_diff_relative:
          type: number
          nullable: true
          description: "mean_diff / baseline_mean. Null when baseline is zero or non-finite."
        ci95_low:
          type: number
        ci95_high:
          type: number
        significant:
          type: boolean
          description: True iff the 95% CI excludes zero.

    SensitivityResponse:
      type: object
      required: [metric, baseline_mean, num_sims, base_seed, rows]
      properties:
        metric:
          type: string
        baseline_mean:
          type: number
        num_sims:
          type: integer
        base_seed:
          type: integer
          format: int64
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SensitivityRow"

    SensitivityDefaultsResponse:
      type: object
      required: [deltas]
      properties:
        deltas:
          type: array
          items:
            type: object
            required: [stat, delta, multiplicative]
            properties:
              stat:
                type: string
              delta:
                type: number
              multiplicative:
                type: boolean

    MorrisSensitivityRequest:
      type: object
      required: [ship, hostile]
      properties:
        ship:
          type: string
        hostile:
          type: string
        ship_tier:
          type: integer
        ship_level:
          type: integer
        captain:
          type: string
        bridge:
          type: array
          items: { type: string }
        below_decks:
          type: array
          items: { type: string }
        support_buffs:
          type: array
          items: { type: string }
        profile_id:
          type: string
        num_sims:
          type: integer
          minimum: 2
          maximum: 10000
          description: Paired sims per trajectory point. Clamped server-side.
        r_trajectories:
          type: integer
          minimum: 2
          maximum: 200
          description: Number of Morris trajectories. Clamped server-side.
        seed:
          type: integer
          format: int64
        rounds:
          type: integer
        metric:
          type: string
          enum: [hull_remaining, win_rate, rounds_to_kill, defender_hull_remaining]
        deltas:
          type: object
          additionalProperties:
            type: number
          description: |
            Per-stat δ overrides. Keys are stat names (snake_case). A value of `0.0`
            drops the stat from the trajectory entirely. Missing keys use defaults.

    MorrisSensitivityRow:
      type: object
      required:
        [
          stat,
          delta_applied,
          mu_star,
          mu,
          sigma,
          n_samples,
          mu_star_ci95_low,
          mu_star_ci95_high,
        ]
      properties:
        stat:
          type: string
        delta_applied:
          type: number
        mu_star:
          type: number
          description: Mean of `|EE|` across trajectories. Importance.
        mu:
          type: number
          description: Mean signed EE. Direction.
        sigma:
          type: number
          description: |
            Sample std of EE across trajectories. High σ relative to μ\* indicates the
            stat's effect depends on other previously-perturbed stats (interaction).
        n_samples:
          type: integer
        mu_star_ci95_low:
          type: number
        mu_star_ci95_high:
          type: number

    MorrisSensitivityResponse:
      type: object
      required:
        [
          metric,
          num_sims_per_point,
          r_trajectories,
          k_stats,
          base_seed,
          total_sims,
          rows,
        ]
      properties:
        metric:
          type: string
        num_sims_per_point:
          type: integer
        r_trajectories:
          type: integer
        k_stats:
          type: integer
        base_seed:
          type: integer
          format: int64
        total_sims:
          type: integer
          format: int64
        rows:
          type: array
          items:
            $ref: "#/components/schemas/MorrisSensitivityRow"

    MorrisSensitivityDefaultsResponse:
      type: object
      required:
        [
          deltas,
          r_trajectories_default,
          r_trajectories_max,
          num_sims_default,
          num_sims_max,
        ]
      properties:
        deltas:
          type: array
          items:
            type: object
            required: [stat, delta, multiplicative]
            properties:
              stat:
                type: string
              delta:
                type: number
              multiplicative:
                type: boolean
        r_trajectories_default:
          type: integer
        r_trajectories_max:
          type: integer
        num_sims_default:
          type: integer
        num_sims_max:
          type: integer

    SobolSensitivityRequest:
      type: object
      required: [ship, hostile]
      properties:
        ship:
          type: string
        hostile:
          type: string
        ship_tier:
          type: integer
        ship_level:
          type: integer
        captain:
          type: string
        bridge:
          type: array
          items: { type: string }
        below_decks:
          type: array
          items: { type: string }
        support_buffs:
          type: array
          items: { type: string }
        profile_id:
          type: string
        n_samples:
          type: integer
          minimum: 8
          maximum: 8192
          description: Samples per Saltelli matrix. Clamped server-side.
        seed:
          type: integer
          format: int64
        rounds:
          type: integer
        metric:
          type: string
          enum: [hull_remaining, win_rate, rounds_to_kill, defender_hull_remaining]
        deltas:
          type: object
          additionalProperties:
            type: number
          description: |
            Per-stat **base δ** overrides. Each u_i ∈ [0, 1] from the Saltelli matrix
            is mapped to a perturbation δ_i ∈ [0, 2 · base_δ_i]. A `0.0` override
            drops the stat from the analysis entirely.
        include_pairwise:
          type: boolean
          description: |
            When true, also compute second-order Sobol indices `S_ij` for every distinct
            pair of stats. Off by default — the extra cost is `N × k(k−1)/2` engine calls
            on top of the `N × (k + 2)` baseline (≈ 8.6× at default `N = 512`, `k = 18`).

    SobolSensitivityPairRow:
      type: object
      required:
        [stat_a, stat_b, base_delta_a, base_delta_b, s_ij, s_ij_ci95_low, s_ij_ci95_high]
      properties:
        stat_a:
          type: string
        stat_b:
          type: string
          description: |
            Pairs are reported once with `stat_a < stat_b` in `StatKey::ALL` order. The
            second-order index is symmetric so this is purely compact serialization.
        base_delta_a:
          type: number
        base_delta_b:
          type: number
        s_ij:
          type: number
          description: |
            Pure second-order Sobol index. The fraction of Var(Y) explained by the
            interaction between stats A and B *beyond* their individual main effects
            (which appear in the per-stat rows under `s1`). Clamped to `[0, 1]` for
            display.
        s_ij_ci95_low:
          type: number
        s_ij_ci95_high:
          type: number

    SobolSensitivityRow:
      type: object
      required:
        [
          stat,
          base_delta,
          s1,
          st,
          interaction,
          s1_ci95_low,
          s1_ci95_high,
          st_ci95_low,
          st_ci95_high,
        ]
      properties:
        stat:
          type: string
        base_delta:
          type: number
        s1:
          type: number
          description: First-order Sobol index (main effect alone).
        st:
          type: number
          description: Total-order Sobol index (main + all interactions involving this stat).
        interaction:
          type: number
          description: |
            `S_T_i − S_i` — fraction of variance from interactions between this stat
            and any other. For which specific pair(s), set `include_pairwise: true` in
            the request and inspect `pairs`.
        s1_ci95_low:
          type: number
        s1_ci95_high:
          type: number
        st_ci95_low:
          type: number
        st_ci95_high:
          type: number

    SobolSensitivityResponse:
      type: object
      required:
        [
          metric,
          n_samples,
          k_stats,
          base_seed,
          total_sims,
          output_variance,
          rows,
        ]
      properties:
        metric:
          type: string
        n_samples:
          type: integer
        k_stats:
          type: integer
        base_seed:
          type: integer
          format: int64
        total_sims:
          type: integer
          format: int64
        output_variance:
          type: number
          description: Estimated Var(Y) for the run (sanity check).
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SobolSensitivityRow"
        pairs:
          type: array
          description: |
            Pairwise second-order indices. Omitted when `include_pairwise` is false.
            Otherwise one entry per `(stat_a, stat_b)` pair with `k(k−1)/2` total.
          items:
            $ref: "#/components/schemas/SobolSensitivityPairRow"

    SobolSensitivityDefaultsResponse:
      type: object
      required: [deltas, n_samples_default, n_samples_max]
      properties:
        deltas:
          type: array
          items:
            type: object
            required: [stat, delta, multiplicative]
            properties:
              stat:
                type: string
              delta:
                type: number
              multiplicative:
                type: boolean
        n_samples_default:
          type: integer
        n_samples_max:
          type: integer

    CompareCrewsRequest:
      type: object
      required: [ship, hostile, crews]
      properties:
        ship:
          type: string
        hostile:
          type: string
        ship_tier:
          type: integer
        ship_level:
          type: integer
        crews:
          type: array
