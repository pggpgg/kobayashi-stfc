            type: string
        groups:
          type: array
          items:
            $ref: "#/components/schemas/OfficerGroupConstraintDto"
        captain_must_be:
          type: string
        bridge_must_include:
          type: array
          items:
            type: string
        below_decks_must_include:
          type: array
          items:
            type: string

    WarmStartCrewDto:
      type: object
      required: [captain, bridge, below_decks]
      properties:
        captain:
          type: string
        bridge:
          type: array
          items:
            type: string
        below_decks:
          type: array
          items:
            type: string

    ChainGrindRequestDto:
      type: object
      properties:
        enabled:
          type: boolean
        kills_target:
          type: integer
          minimum: 1
          maximum: 50
        secondary:
          type: string

    OptimizeRequest:
      type: object
      required: [ship, hostile]
      properties:
        ship:
          type: string
        hostile:
          type: string
        ship_tier:
          type: integer
        ship_level:
          type: integer
        sims:
          type: integer
          minimum: 1
          maximum: 100000
        seed:
          type: integer
          format: int64
        max_candidates:
          type: integer
        strategy:
          type: string
          description: >
            Optimizer strategy: `exhaustive` (full Monte Carlo on candidates),
            `genetic` (GA for huge spaces), `tiered` (scout then confirm with MC),
            or `linear_eval` (closed-form expected hull damage only; no Monte Carlo).
            When omitted, server auto-picks tiered vs exhaustive from candidate count.
        below_decks_pool_mode:
          type: string
          enum: [strict, scored, relaxed]
          description: >
            Below-decks pool tier. `strict` (default): combat-modifier-only below-decks officers.
            `scored`: all below-decks-ability officers ranked by combat relevance (combat → ambiguous → economy-only)
            with officer power as tiebreaker. `relaxed`: all eligible officers ranked by power.
            Unknown values fall back to strict.
        heuristics_seeds:
          type: array
          items:
            type: string
        heuristics_only:
          type: boolean
        fast_discovery:
          type: boolean
        below_decks_strategy:
          type: string
        analytical_prefilter_keep:
          type: integer
        enable_learned_pair_prior:
          type: boolean
          description: >
            Analytical prefilter only. When false, disables learned pair co-occurrence prior from
            warm-start/history refs. Omitted defaults to enabled (backward compatible).
        tiered_scout_sims:
          type: integer
        tiered_top_k:
          type: integer
        tiered_scout_uniform:
          type: boolean
        tiered_confirm_budget_cap_mult:
          type: number
          description: >
            Tiered: when set, scales down per-top-K confirmation iterations so their sum does not
            exceed floor(mult * tiered_top_k * sims). Exhaustive two-phase: same cap on the
            width-based confirmation pass for the top exhaustive_scout_top_keep crews. Omit for no
            global cap (default). Typical values 1.5–3; must be in (0, 20].
        exhaustive_scout_sims:
          type: integer
          minimum: 1
          maximum: 100000
          description: >
            Exhaustive strategy only; must be sent together with exhaustive_scout_top_keep.
            Scout-phase Monte Carlo trials per remaining candidate after analytical prefilter; then
            full `sims` run only on the top exhaustive_scout_top_keep crews by scout ranking.
        exhaustive_scout_top_keep:
          type: integer
          minimum: 1
          maximum: 500
          description: >
            Exhaustive strategy only; paired with exhaustive_scout_sims. How many top scout-ranked
            crews receive the full per-crew simulation_count (others keep scout statistics).
        warm_start_crews:
          type: array
          items:
            $ref: "#/components/schemas/WarmStartCrewDto"
        below_decks_slots:
          type: integer
        constraints:
          $ref: "#/components/schemas/OptimizeConstraintsDto"
        support_buffs:
          type: array
          items:
            type: string
        defender_support_buffs:
          type: array
          items:
            type: string
          description: >
            PvP only: defender alliance support buff ids (Fortify, Defiant Reinforce). When present,
            `support_buffs` is treated as attacker-only for static routing.
        defender_alliance_debuffs:
          type: array
          items:
            type: string
          description: >
            PvP only: alliance debuffs applied to the attacker (e.g. Mantis sting when modeled).
        chain:
          $ref: "#/components/schemas/ChainGrindRequestDto"
        defender_opponent:
          type: string
        defender_crew:
          $ref: "#/components/schemas/SimulateCrew"
          description: >
            Optional LCARS crew for the defending combatant (merged with hostile ship abilities).
            Same shape as simulate `defender_crew`. Ignored when `strategy` is `genetic` (request fails validation).
        defender_ship:
          type: string
          description: >
            Fixed opponent player ship for PvP (mutually exclusive with `hostile`). Optimize searches
            attacker crews only. Requires `defender_profile_id`.
        defender_ship_tier:
          type: integer
        defender_ship_level:
          type: integer
        defender_profile_id:
          type: string
        enemy_type:
          type: string
          description: >-
            Combat scenario for officer eligibility filtering (snake_case EnemyType). Inferred
            from the target when unset.
        novelty_lambda:
          type: number
        novelty_diverse_top:
          type: integer
        novelty_pool:
          type: integer
        novelty_history_anchors:
          type: boolean
          description: >
            When true with novelty_lambda, crews from optimize_history for this profile + optimize_cache_key
            (matching chain fingerprint) are treated as redundancy anchors for MMR; they are not added as recommendations.
        optimize_cache_key:
          type: string
          description: >
            Opaque client fingerprint (e.g. workspace warm-start key). When set and the request
            runs with an active profile, the server may load matching `optimize_history.json` rows
            for Monte Carlo reuse (tiered / exhaustive two-phase) and for analytical matchup priors
            (reference crews from history only; same chain fingerprint as this request’s `chain`).

    ReplaySeedCrew:
      type: object
